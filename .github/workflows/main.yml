name: Build MyType APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android ZIP
        run: |
          mkdir project
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)
          echo "ZIP found: $ZIP"
          unzip -q "$ZIP" -d project

      - name: Find Android project
        run: |
          find project -name "settings.gradle" -o -name "settings.gradle.kts"

      - name: Build APK
        run: |
          ROOT=$(find project -name "settings.gradle" -o -name "settings.gradle.kts" | head -1 | xargs dirname)
          echo "Project root: $ROOT"
          cd "$ROOT"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyType-APK
          path: |
            project/**/build/outputs/apk/**/*.apk
